syntax = "proto3";

package sample.tasktide.sync.proto;

enum PriorityDto {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_URGENT = 4;
}

message TaskDto {
  string id = 1;
  string title = 2;
  string notes = 3;
  PriorityDto priority = 4;
  int64 due_at = 5;
  bool done = 6;
  repeated string tags = 7;
  int64 updated_at = 8;
}

message SyncRequest {
  string device_id = 1;
  int64 since = 2;
  repeated TaskDto tasks = 3;
}

message SyncResponse {
  repeated TaskDto tasks = 1;
  int64 server_time = 2;
}
