plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.example.shared'

afterEvaluate {
    version = '1.0'
    project.version = '2.0'
    version = '3.0'
    publishing {
        publications {
            release(MavenPublication) {
                artifactId = 'aliased'
            }
        }
    }
}
