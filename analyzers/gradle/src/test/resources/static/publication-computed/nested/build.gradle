plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.example.shared'

afterEvaluate {
    afterEvaluate {
        version = '3.0'
    }
}

afterEvaluate {
    version = '2.0'
    publishing {
        publications {
            release(MavenPublication) {
                artifactId = 'nested'
            }
        }
    }
}
