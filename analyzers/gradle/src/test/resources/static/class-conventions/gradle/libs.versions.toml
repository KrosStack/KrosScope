[versions]
kotlin = "2.4.20"
junit = "4.13.2"
compose-bom = "2026.06.01"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-tracing-ktx = { module = "androidx.tracing:tracing-ktx", version = "1.3.0" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }

[bundles]
testing = ["junit", "kotlin-test"]

[plugins]
acme-android-library = { id = "acme.android.library" }
acme-android-library-compose = { id = "acme.android.library.compose" }
