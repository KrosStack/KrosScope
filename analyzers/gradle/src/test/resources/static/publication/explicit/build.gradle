plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.example.explicit'
version = '2.0.0'

publishing {
    publications {
        release(MavenPublication) {
            artifactId = 'explicit-release'
        }
        debug(MavenPublication) {
            groupId = 'org.example.other'
            version = '2.1.0'
        }
    }
}
