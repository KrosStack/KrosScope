[versions]
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
junit = "5.14.4"
detekt = "2.0.0-alpha.6"
sqlite-jdbc = "3.53.4.0"
clikt = "5.1.0"
gradle-tooling = "9.8.0"
slf4j = "2.0.17"
groovy = "5.1.3"
tomlj = "2.2.0"
analysis-api = "2.4.10"
caffeine = "2.9.3"
intellij-coroutines = "1.10.2-intellij-2"
wire = "7.1.0"
jsqlparser = "5.4"
jtokkit = "1.1.0"
jna = "5.14.0"
onnxruntime = "1.31.1"

[libraries]
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
gradle-tooling-api = { module = "org.gradle:gradle-tooling-api", version.ref = "gradle-tooling" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
kotlin-analysis-api-standalone = { module = "org.jetbrains.kotlin:analysis-api-standalone-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api = { module = "org.jetbrains.kotlin:analysis-api-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api-k2 = { module = "org.jetbrains.kotlin:analysis-api-k2-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api-impl-base = { module = "org.jetbrains.kotlin:analysis-api-impl-base-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api-platform-interface = { module = "org.jetbrains.kotlin:analysis-api-platform-interface-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api-low-level-fir = { module = "org.jetbrains.kotlin:low-level-api-fir-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api-light-classes = { module = "org.jetbrains.kotlin:symbol-light-classes-for-ide", version.ref = "analysis-api" }
kotlin-analysis-api-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "analysis-api" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
intellij-coroutines = { module = "org.jetbrains.intellij.deps.kotlinx:kotlinx-coroutines-core", version.ref = "intellij-coroutines" }
wire-schema = { module = "com.squareup.wire:wire-schema", version.ref = "wire" }
# JSqlParser is dual-licensed under LGPL-2.1 and Apache-2.0; KrosScope uses it under Apache-2.0.
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
# JNA is dual-licensed under LGPL-2.1-or-later and Apache-2.0; KrosScope uses it under Apache-2.0.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detekt-rules-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-cli = { module = "dev.detekt:detekt-cli", version.ref = "detekt" }

kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[bundles]
kotlin-analysis-api = [
    "kotlin-analysis-api-standalone",
    "kotlin-analysis-api",
    "kotlin-analysis-api-k2",
    "kotlin-analysis-api-impl-base",
    "kotlin-analysis-api-platform-interface",
    "kotlin-analysis-api-low-level-fir",
    "kotlin-analysis-api-light-classes",
]
